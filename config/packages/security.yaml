security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        etudiant_provider:
            entity:
                class: App\Entity\Etudiant
                property: email
        entreprise_provider:
            entity:
                class: App\Entity\Entreprise
                property: email
        administrateur_provider:
            entity:
                class: App\Entity\Administrateur
                property: email
        chain_provider:
            chain:
                providers: ['etudiant_provider', 'entreprise_provider', 'administrateur_provider']

    firewalls:
        dev:
            pattern: ^/(css|images|js|assets|_wdt|_profiler|_error)
            security: false

        main:
            provider: chain_provider
            lazy: true
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: /
            logout:
                path: logout
                target: /

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/etudiant/register, roles: PUBLIC_ACCESS }
        - { path: ^/visiteur, roles: PUBLIC_ACCESS }
        - { path: ^/entreprise/register, roles: ROLE_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/entreprise, roles: ROLE_ENTREPRISE }
        - { path: ^/etudiant, roles: ROLE_ETUDIANT }
